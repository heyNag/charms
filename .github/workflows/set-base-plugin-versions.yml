name: Set Base Plugin Versions
run-name: Set all Agent Plugin versions to 2026.8.10

on:
  workflow_dispatch:

concurrency:
  group: set-base-plugin-versions
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  set-versions:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Require the default branch
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          if [ "${GITHUB_REF_TYPE}" != "branch" ] || [ "${GITHUB_REF_NAME}" != "${DEFAULT_BRANCH}" ]; then
            echo "Set Base Plugin Versions must run from ${DEFAULT_BRANCH}." >&2
            exit 1
          fi

      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
        with:
          fetch-depth: 0
          fetch-tags: true
          persist-credentials: false

      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.11"

      - name: Install validation tools
        run: python -m pip install --quiet --requirement requirements-dev.txt

      - name: Require an empty remote release inventory
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          remote_tags="$(git ls-remote --tags origin)"
          remote_releases="$(
            gh api --paginate "repos/${GITHUB_REPOSITORY}/releases?per_page=100" \
              --jq '.[].tag_name'
          )"
          if [ -n "${remote_tags}" ] || [ -n "${remote_releases}" ]; then
            echo "All remote tags and releases must be absent." >&2
            exit 1
          fi

      - name: Set the exact base UTC-date versions
        env:
          SOURCE_VERSION: 2026.8.10.1
          TARGET_VERSION: 2026.8.10
        run: |
          python3 - <<'PY'
          import datetime as dt
          import json
          import os
          from pathlib import Path

          expected_names = {
              "chatgpt-pro-review",
              "codex-reset-credit",
              "mnemosyne-memory",
              "watch-video",
              "x-bookmarks",
          }
          source_version = os.environ["SOURCE_VERSION"]
          target_version = os.environ["TARGET_VERSION"]
          today = dt.datetime.now(dt.timezone.utc).date()
          expected_target = f"{today.year:04d}.{today.month}.{today.day}"
          if target_version != expected_target:
              raise SystemExit(
                  f"target {target_version} is not the current UTC date {expected_target}"
              )

          manifests = sorted(Path("packages").glob("*/plugin.json"))
          names = {path.parent.name for path in manifests}
          if names != expected_names or len(manifests) != len(expected_names):
              raise SystemExit(
                  f"unexpected plugin inventory: {sorted(names)}"
              )

          for manifest in manifests:
              data = json.loads(manifest.read_text(encoding="utf-8"))
              name = manifest.parent.name
              if data.get("name") != name:
                  raise SystemExit(f"{manifest}: manifest name does not match {name}")
              if data.get("version") != source_version:
                  raise SystemExit(
                      f"{manifest}: expected {source_version}, found {data.get('version')!r}"
                  )
              data["version"] = target_version
              manifest.write_text(json.dumps(data, indent=2) + "\n", encoding="utf-8")
          PY

          expected="$(
            printf '%s\n' \
              packages/chatgpt-pro-review/plugin.json \
              packages/codex-reset-credit/plugin.json \
              packages/mnemosyne-memory/plugin.json \
              packages/watch-video/plugin.json \
              packages/x-bookmarks/plugin.json |
              sort
          )"
          changed="$(git diff --name-only | sort)"
          if [ "${changed}" != "${expected}" ]; then
            echo "Version reset changed an unexpected path." >&2
            printf 'expected:\n%s\nactual:\n%s\n' "${expected}" "${changed}" >&2
            exit 1
          fi
          git diff --check

      - name: Full repository check
        run: make check

      - name: Commit and push the exact manifest set
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          base_sha="$(git rev-parse HEAD)"
          expected="$(
            printf '%s\n' \
              packages/chatgpt-pro-review/plugin.json \
              packages/codex-reset-credit/plugin.json \
              packages/mnemosyne-memory/plugin.json \
              packages/watch-video/plugin.json \
              packages/x-bookmarks/plugin.json |
              sort
          )"
          changed="$(git diff --name-only | sort)"
          if [ "${changed}" != "${expected}" ]; then
            echo "Repository checks changed the proposed manifest set." >&2
            exit 1
          fi

          remote_tags="$(git ls-remote --tags origin)"
          remote_releases="$(
            gh api --paginate "repos/${GITHUB_REPOSITORY}/releases?per_page=100" \
              --jq '.[].tag_name'
          )"
          remote_sha="$(git ls-remote origin "refs/heads/${GITHUB_REF_NAME}" | cut -f 1)"
          if [ -n "${remote_tags}" ] || [ -n "${remote_releases}" ]; then
            echo "Remote tags or releases appeared during validation." >&2
            exit 1
          fi
          if [ "${remote_sha}" != "${base_sha}" ]; then
            echo "The default branch changed during validation." >&2
            exit 1
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            packages/chatgpt-pro-review/plugin.json \
            packages/codex-reset-credit/plugin.json \
            packages/mnemosyne-memory/plugin.json \
            packages/watch-video/plugin.json \
            packages/x-bookmarks/plugin.json
          staged="$(git diff --cached --name-only | sort)"
          if [ "${staged}" != "${expected}" ]; then
            echo "Reset commit contains an unexpected path." >&2
            exit 1
          fi
          git commit -m "Set Agent Plugin versions to 2026.8.10"
          commit_sha="$(git rev-parse HEAD)"

          gh auth setup-git
          git push origin "HEAD:${GITHUB_REF_NAME}"
          pushed_sha="$(git ls-remote origin "refs/heads/${GITHUB_REF_NAME}" | cut -f 1)"
          if [ "${pushed_sha}" != "${commit_sha}" ]; then
            echo "Remote branch does not point at the version commit." >&2
            exit 1
          fi
