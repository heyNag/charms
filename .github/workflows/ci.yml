name: CI

on:
  push:
  pull_request:
  workflow_call:

permissions:
  contents: read

jobs:
  ci:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
        with:
          fetch-depth: 0

      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.11"

      - name: Install pinned development dependencies
        run: python -m pip install --requirement requirements-dev.txt

      - name: Install ffmpeg so frame-engine tests run
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ffmpeg
          ffmpeg -version | sed -n '1p'

      - name: Test, lint, and validate plugins
        run: make ci

  macos-tests:
    runs-on: macos-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7

      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.11"

      - name: Install pinned development dependencies
        run: python -m pip install --requirement requirements-dev.txt

      - name: Install current FFmpeg
        shell: bash
        run: |
          brew install ffmpeg
          ffmpeg -version | sed -n '1p'

      # Current FFmpeg releases no longer accept -vsync, so Homebrew's build covers
      # the -fps_mode path while Ubuntu's older packaged FFmpeg covers -vsync.
      - name: Require an FFmpeg build without -vsync
        shell: bash
        run: |
          help_output="$(ffmpeg -hide_banner -h full 2>&1)"
          case "${help_output}" in
            *-fps_mode*) ;;
            *) echo "Expected -fps_mode support" >&2; exit 1 ;;
          esac
          case "${help_output}" in
            *-vsync*) echo "Expected a build with -vsync removed" >&2; exit 1 ;;
            *) ;;
          esac

      - name: Run offline test suites
        shell: bash
        env:
          PYTHONDONTWRITEBYTECODE: "1"
        run: make test
