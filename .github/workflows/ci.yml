name: CI

on:
  push:
  pull_request:

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
        with:
          fetch-depth: 0

      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.11"

      - name: Install ffmpeg so frame-engine tests run
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ffmpeg

      - name: Lint with ruff
        run: |
          python -m pip install --quiet ruff
          ruff check .

      - name: Enforce release-only version bumps
        run: |
          base="${PR_BASE_SHA:-$PUSH_BASE_SHA}"
          head="${PR_HEAD_SHA:-$GITHUB_SHA}"
          python3 scripts/check-version-policy.py --base "$base" --head "$head" --actor "$GITHUB_ACTOR"
        env:
          PUSH_BASE_SHA: ${{ github.event.before }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}

      - name: Public readiness check
        run: make public-check

  cross-platform-tests:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7

      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.11"

      - name: Install ffmpeg
        shell: bash
        run: |
          if command -v ffmpeg >/dev/null 2>&1 && command -v ffprobe >/dev/null 2>&1; then
            echo "ffmpeg already present"
          elif [ "$RUNNER_OS" = "macOS" ]; then
            brew install ffmpeg
          else
            choco install ffmpeg -y --no-progress
          fi

      - name: Run offline test suites
        shell: bash
        env:
          PYTHONDONTWRITEBYTECODE: "1"
        run: |
          python -m unittest discover -s tests -p 'test_*.py'
          for test_dir in packages/*/tests; do
            echo "testing ${test_dir}"
            python -m unittest discover -s "${test_dir}" -p 'test_*.py'
          done
