name: CI

on:
  # A branch gets its run from its pull request, so a push to it starts no second one.
  push:
    branches: [main]
  pull_request:
  workflow_call:
  # The release workflow starts a run on main after it pushes the marketplace commit.
  workflow_dispatch:

# A newer push to a pull request replaces the run of the older one. Every other
# run is in a group of its own, so a run on main or in a release is never
# cancelled and never waits for another.
concurrency:
  group: ci-${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number) || github.run_id }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  pstack:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0

      - name: Select pstack checks
        id: scope
        env:
          BASE: ${{ github.event.pull_request.base.sha || github.event.before || '' }}
        shell: bash
        run: |
          if [ -z "$BASE" ] || ! git cat-file -e "$BASE^{commit}" 2>/dev/null; then
            echo 'run=true' >> "$GITHUB_OUTPUT"
          elif git diff --quiet "$BASE" HEAD -- packages/pstack integrations/pstack scripts tests .github/workflows/ci.yml; then
            echo 'run=false' >> "$GITHUB_OUTPUT"
          else
            echo 'run=true' >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        if: steps.scope.outputs.run == 'true'
        with:
          python-version: "3.11"

      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        if: steps.scope.outputs.run == 'true'
        with:
          node-version: "24.22.1"

      - name: Verify exact pinned generation
        if: steps.scope.outputs.run == 'true'
        env:
          PYTHONDONTWRITEBYTECODE: "1"
        run: python scripts/sync-pstack.py --fetch --check

      - name: Test unchanged upstream helpers in disposable copies
        if: steps.scope.outputs.run == 'true'
        run: |
          curl --fail --location --silent --show-error --max-time 60 \
            https://github.com/tlaplus/tlaplus/releases/download/v1.7.4/tla2tools.jar \
            --output "${RUNNER_TEMP}/tla2tools.jar"
          python scripts/test-pstack-upstream.py --install --tlc "${RUNNER_TEMP}/tla2tools.jar"

      - name: Require upstream checks to preserve the checkout
        if: steps.scope.outputs.run == 'true'
        run: test -z "$(git status --porcelain)"

  ci:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        # The oldest Python the repository tooling supports, and the newest release.
        python: ["3.11", "3.15"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ matrix.python }}

      - name: Install pinned development dependencies
        run: make dev-deps PYTHON=python

      - name: Install ffmpeg so frame-engine tests run
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ffmpeg
          ffmpeg -version | sed -n '1p'

      - name: Test, lint, and validate plugins
        run: make ci

      # The tests run once more, under coverage.py. One Python version is
      # enough to show the total falling below the floor in pyproject.toml.
      - name: Measure test coverage
        if: matrix.python == '3.11'
        run: make coverage

      - name: Require checks to leave the tree clean
        run: |
          changed="$(git status --porcelain)"
          if [ -n "${changed}" ]; then
            echo "Repository checks changed the working tree:" >&2
            echo "${changed}" >&2
            exit 1
          fi

  # The plugins support Python 3.9, which is older than the tooling above needs.
  # Their tests use the standard library only, so nothing is installed with pip
  # and one schema cross-check that needs jsonschema is skipped.
  python-floor:
    # setup-python has no Python 3.9 build for runner images newer than this one.
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.9"

      - name: Install ffmpeg so frame-engine tests run
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ffmpeg
          ffmpeg -version | sed -n '1p'

      # FFmpeg older than 5.1 has no -fps_mode, and the plugin passes -vsync to
      # it. This image's FFmpeg accepts both options, which lets a test run that
      # fallback against a real build. Current releases have dropped -vsync, so
      # on a newer image the test would be skipped without a word.
      - name: Require an FFmpeg build that still accepts -vsync
        run: |
          help_output="$(ffmpeg -hide_banner -h full 2>&1)"
          for option in -fps_mode -vsync; do
            case "${help_output}" in
              *"${option}"*) ;;
              *) echo "Expected ${option} support, which the -vsync fallback test needs" >&2; exit 1 ;;
            esac
          done

      - name: Run the plugin tests on the oldest supported Python
        run: |
          python3 --version
          make test-plugins

  macos-tests:
    runs-on: macos-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.15"

      - name: Install pinned development dependencies
        run: make dev-deps PYTHON=python

      - name: Install current FFmpeg
        shell: bash
        run: |
          brew install ffmpeg
          ffmpeg -version | sed -n '1p'

      # Current FFmpeg releases no longer accept -vsync. Homebrew's build shows
      # that the plugin does not pass it to them; the python-floor job covers a
      # build that still accepts it.
      - name: Require an FFmpeg build without -vsync
        shell: bash
        run: |
          help_output="$(ffmpeg -hide_banner -h full 2>&1)"
          case "${help_output}" in
            *-fps_mode*) ;;
            *) echo "Expected -fps_mode support" >&2; exit 1 ;;
          esac
          case "${help_output}" in
            *-vsync*) echo "Expected a build with -vsync removed" >&2; exit 1 ;;
            *) ;;
          esac

      - name: Run offline test suites
        shell: bash
        env:
          PYTHONDONTWRITEBYTECODE: "1"
        run: make test

      # Apple's Command Line Tools ship their own python3. It is the oldest
      # interpreter the plugins are likely to meet on a Mac.
      - name: Run the plugin tests on the Python that macOS ships
        shell: bash
        env:
          PYTHONDONTWRITEBYTECODE: "1"
        run: |
          if /usr/bin/python3 --version; then
            make test-plugins PYTHON=/usr/bin/python3
          else
            echo "::warning::/usr/bin/python3 is not available on this runner, so the plugin tests did not run on it."
          fi
