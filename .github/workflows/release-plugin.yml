name: Release Plugin
run-name: Release ${{ inputs.plugin }}

on:
  workflow_dispatch:
    inputs:
      plugin:
        description: Agent Plugin package name, for example watch-video
        required: true
        type: string

concurrency:
  group: release-plugin-${{ inputs.plugin }}
  cancel-in-progress: false

permissions:
  contents: read

env:
  PYTHONDONTWRITEBYTECODE: "1"

jobs:
  ci:
    permissions:
      contents: read
    uses: ./.github/workflows/ci.yml

  validate:
    permissions:
      contents: read
    runs-on: ubuntu-latest
    timeout-minutes: 30
    outputs:
      archive_sha256: ${{ steps.archive_check.outputs.archive_sha256 }}
      commit_sha: ${{ steps.plan.outputs.commit_sha }}
      previous_tag: ${{ steps.plan.outputs.previous_tag }}
      tag: ${{ steps.plan.outputs.tag }}
      version: ${{ steps.plan.outputs.version }}
    steps:
      - name: Require the default branch
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          if [ "${GITHUB_REF_TYPE}" != "branch" ] || [ "${GITHUB_REF_NAME}" != "${DEFAULT_BRANCH}" ]; then
            echo "Release Plugin must run from ${DEFAULT_BRANCH}." >&2
            exit 1
          fi

      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
        with:
          fetch-depth: 0
          fetch-tags: true
          persist-credentials: false

      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.11"

      - name: Install validation tools
        run: python -m pip install --quiet --requirement requirements-dev.txt

      - name: Plan the release
        id: plan
        env:
          PLUGIN: ${{ inputs.plugin }}
        run: |
          plan="$(python3 scripts/plan-plugin-release.py "${PLUGIN}")"
          tag="$(printf '%s\n' "${plan}" | sed -n 's/^tag=//p')"

          set +e
          git ls-remote --exit-code --tags origin "refs/tags/${tag}" >/dev/null 2>&1
          tag_probe_status=$?
          set -e
          if [ "${tag_probe_status}" -eq 0 ]; then
            echo "Remote tag already exists: ${tag}" >&2
            exit 1
          fi
          if [ "${tag_probe_status}" -ne 2 ]; then
            echo "Could not verify whether remote tag ${tag} exists." >&2
            exit 1
          fi

          {
            printf '%s\n' "${plan}"
            echo "commit_sha=$(git rev-parse HEAD)"
          } >> "${GITHUB_OUTPUT}"

      - name: Full repository check
        run: make check

      - name: Require checks to leave the tree clean
        run: |
          changed="$(git status --porcelain)"
          if [ -n "${changed}" ]; then
            echo "Repository checks changed the working tree:" >&2
            echo "${changed}" >&2
            exit 1
          fi

      - name: Build validation archive
        id: archive
        env:
          PLUGIN: ${{ inputs.plugin }}
        run: |
          python3 scripts/build-plugin-archive.py "${PLUGIN}" \
            --output-dir "${RUNNER_TEMP}/agent-plugins" >> "${GITHUB_OUTPUT}"

      - name: Validate proposed archive
        id: archive_check
        env:
          ARCHIVE: ${{ steps.archive.outputs.archive }}
          CHECKSUM: ${{ steps.archive.outputs.checksum }}
          EXPECTED_VERSION: ${{ steps.plan.outputs.version }}
          PLUGIN: ${{ inputs.plugin }}
          VERSION: ${{ steps.archive.outputs.version }}
        run: |
          if [ "${VERSION}" != "${EXPECTED_VERSION}" ]; then
            echo "Archive version ${VERSION} does not match the planned ${EXPECTED_VERSION}." >&2
            exit 1
          fi
          (cd "$(dirname "${ARCHIVE}")" && sha256sum --check "$(basename "${CHECKSUM}")")
          python3 -m zipfile --test "${ARCHIVE}"
          extract_dir="$(mktemp -d)"
          python3 -m zipfile --extract "${ARCHIVE}" "${extract_dir}"
          python3 scripts/validate_plugins.py "${extract_dir}/${PLUGIN}"
          echo "archive_sha256=$(sha256sum "${ARCHIVE}" | cut -d ' ' -f 1)" >> "${GITHUB_OUTPUT}"

  publish:
    needs: [ci, validate]
    permissions:
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Require the default branch
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          if [ "${GITHUB_REF_TYPE}" != "branch" ] || [ "${GITHUB_REF_NAME}" != "${DEFAULT_BRANCH}" ]; then
            echo "Release Plugin must run from ${DEFAULT_BRANCH}." >&2
            exit 1
          fi

      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
        with:
          fetch-depth: 0
          fetch-tags: true
          persist-credentials: false

      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.11"

      # Re-plan against current tags, so re-running an old run cannot publish a
      # version that a newer release has already superseded.
      - name: Require the validated commit on main and the same release plan
        env:
          COMMIT_SHA: ${{ needs.validate.outputs.commit_sha }}
          PLUGIN: ${{ inputs.plugin }}
          PREVIOUS_TAG: ${{ needs.validate.outputs.previous_tag }}
          TAG: ${{ needs.validate.outputs.tag }}
          VERSION: ${{ needs.validate.outputs.version }}
        run: |
          git fetch --force --tags origin
          git fetch origin "${GITHUB_REF_NAME}"
          if ! git merge-base --is-ancestor "${COMMIT_SHA}" "origin/${GITHUB_REF_NAME}"; then
            echo "${COMMIT_SHA} is no longer on ${GITHUB_REF_NAME}." >&2
            exit 1
          fi
          plan="$(python3 scripts/plan-plugin-release.py "${PLUGIN}" --revision "${COMMIT_SHA}")"
          expected="$(printf 'version=%s\ntag=%s\nprevious_tag=%s' "${VERSION}" "${TAG}" "${PREVIOUS_TAG}")"
          if [ "${plan}" != "${expected}" ]; then
            echo "The release plan changed since validation; dispatch a new release." >&2
            printf 'validated:\n%s\nnow:\n%s\n' "${expected}" "${plan}" >&2
            exit 1
          fi
          set +e
          git ls-remote --exit-code --tags origin "refs/tags/${TAG}" >/dev/null 2>&1
          tag_probe_status=$?
          set -e
          if [ "${tag_probe_status}" -eq 0 ]; then
            echo "Remote tag already exists: ${TAG}" >&2
            exit 1
          fi
          if [ "${tag_probe_status}" -ne 2 ]; then
            echo "Could not verify whether remote tag ${TAG} exists." >&2
            exit 1
          fi

      - name: Build portable release archive from the validated commit
        id: archive
        env:
          COMMIT_SHA: ${{ needs.validate.outputs.commit_sha }}
          PLUGIN: ${{ inputs.plugin }}
        run: |
          source_tree="$(mktemp -d)"
          git archive "${COMMIT_SHA}" -- "packages/${PLUGIN}" | tar -x -C "${source_tree}"
          python3 scripts/build-plugin-archive.py "${PLUGIN}" --root "${source_tree}" \
            --output-dir "${RUNNER_TEMP}/agent-plugins" >> "${GITHUB_OUTPUT}"

      - name: Verify portable release archive
        env:
          ARCHIVE: ${{ steps.archive.outputs.archive }}
          CHECKSUM: ${{ steps.archive.outputs.checksum }}
          EXPECTED_SHA256: ${{ needs.validate.outputs.archive_sha256 }}
          EXPECTED_VERSION: ${{ needs.validate.outputs.version }}
          PLUGIN: ${{ inputs.plugin }}
          VERSION: ${{ steps.archive.outputs.version }}
        run: |
          if [ "${VERSION}" != "${EXPECTED_VERSION}" ]; then
            echo "Archive version ${VERSION} does not match release ${EXPECTED_VERSION}." >&2
            exit 1
          fi
          (cd "$(dirname "${ARCHIVE}")" && sha256sum --check "$(basename "${CHECKSUM}")")
          python3 -m zipfile --test "${ARCHIVE}"
          actual_sha256="$(sha256sum "${ARCHIVE}" | cut -d ' ' -f 1)"
          if [ "${actual_sha256}" != "${EXPECTED_SHA256}" ]; then
            echo "Final archive differs from the archive approved by validation." >&2
            exit 1
          fi
          python3 - "${ARCHIVE}" "${PLUGIN}" <<'PY'
          import sys
          import zipfile

          archive, plugin = sys.argv[1:]
          with zipfile.ZipFile(archive) as handle:
              names = handle.namelist()
          required = {
              f"{plugin}/plugin.json",
              f"{plugin}/README.md",
              f"{plugin}/LICENSE",
          }
          missing = sorted(required.difference(names))
          escaped = sorted(
              name
              for name in names
              if not name.startswith(f"{plugin}/")
              or "\\" in name
              or any(part in {"", ".", ".."} for part in name.split("/"))
          )
          if missing or escaped:
              raise SystemExit(f"invalid archive layout: missing={missing}, escaped={escaped}")
          PY

      - name: Create GitHub release
        env:
          ARCHIVE: ${{ steps.archive.outputs.archive }}
          CHECKSUM: ${{ steps.archive.outputs.checksum }}
          COMMIT_SHA: ${{ needs.validate.outputs.commit_sha }}
          GH_TOKEN: ${{ github.token }}
          PLUGIN: ${{ inputs.plugin }}
          PREVIOUS_TAG: ${{ needs.validate.outputs.previous_tag }}
          TAG: ${{ needs.validate.outputs.tag }}
          VERSION: ${{ needs.validate.outputs.version }}
        run: |
          if [ -n "${PREVIOUS_TAG}" ]; then
            changes="$(git log --no-merges --max-count=30 --format='- %s' "${PREVIOUS_TAG}..${COMMIT_SHA}" -- "packages/${PLUGIN}")"
            changes_heading="Changes since \`${PREVIOUS_TAG}\`:"
          else
            changes="- First release."
            changes_heading="Changes:"
          fi

          notes_file="$(mktemp)"
          cat > "${notes_file}" <<EOF
          \`${PLUGIN}\` ${VERSION}, built from \`packages/${PLUGIN}\` at ${COMMIT_SHA}.

          ${changes_heading}

          ${changes}

          Install it from the Charms marketplace in Claude Code or Codex; see the
          repository README. The attached ZIP is the same plugin as a portable
          directory. This release is immutable, so verify the ZIP with
          \`gh release verify-asset ${TAG} <zip> --repo ${GITHUB_REPOSITORY}\`.
          EOF

          gh release create "${TAG}" "${ARCHIVE}" "${CHECKSUM}" \
            --title "${PLUGIN} ${VERSION}" \
            --notes-file "${notes_file}" \
            --target "${COMMIT_SHA}" \
            --latest=false

  # Verification and the marketplace update are separate jobs, so "Re-run failed
  # jobs" can finish an interrupted release without publishing it again.
  verify:
    needs: [validate, publish]
    permissions:
      contents: read
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
        with:
          fetch-depth: 0
          fetch-tags: true
          persist-credentials: false

      - name: Verify the published immutable release
        env:
          COMMIT_SHA: ${{ needs.validate.outputs.commit_sha }}
          EXPECTED_SHA256: ${{ needs.validate.outputs.archive_sha256 }}
          GH_TOKEN: ${{ github.token }}
          PLUGIN: ${{ inputs.plugin }}
          TAG: ${{ needs.validate.outputs.tag }}
          VERSION: ${{ needs.validate.outputs.version }}
        run: |
          git fetch --force origin "refs/tags/${TAG}:refs/tags/${TAG}"
          tag_commit="$(git rev-list -n 1 "refs/tags/${TAG}")"
          if [ "${tag_commit}" != "${COMMIT_SHA}" ]; then
            echo "Published tag targets ${tag_commit}, expected ${COMMIT_SHA}." >&2
            exit 1
          fi

          release_dir="${RUNNER_TEMP}/release"
          gh release download "${TAG}" --repo "${GITHUB_REPOSITORY}" --dir "${release_dir}"
          archive="${release_dir}/${PLUGIN}-agent-plugin-v${VERSION}.zip"
          release_json="$(gh api "repos/${GITHUB_REPOSITORY}/releases/tags/${TAG}")"
          python3 - "${release_json}" "${release_dir}" "${archive}" "${EXPECTED_SHA256}" <<'PY'
          import hashlib
          import json
          import pathlib
          import sys

          release = json.loads(sys.argv[1])
          release_dir = pathlib.Path(sys.argv[2])
          archive = pathlib.Path(sys.argv[3])
          expected_sha256 = sys.argv[4]
          downloaded = {
              path.name: hashlib.sha256(path.read_bytes()).hexdigest()
              for path in release_dir.iterdir()
          }
          digests = {asset["name"]: asset.get("digest") for asset in release["assets"]}
          checksum = archive.with_name(archive.name + ".sha256")
          problems = []
          if release["draft"] or release["prerelease"]:
              problems.append("release must be published, not a draft or prerelease")
          if not release.get("immutable"):
              problems.append("release is not immutable; enable release immutability first")
          if set(digests) != {archive.name, checksum.name} or set(downloaded) != set(digests):
              problems.append(f"unexpected assets {sorted(digests)}")
          elif any(digests[name] != f"sha256:{downloaded[name]}" for name in digests):
              problems.append("downloaded assets do not match their published digests")
          elif downloaded[archive.name] != expected_sha256:
              problems.append("published archive differs from the validated archive")
          elif checksum.read_text(encoding="utf-8") != f"{expected_sha256}  {archive.name}\n":
              problems.append("published checksum file does not name the validated archive")
          if problems:
              raise SystemExit("; ".join(problems))
          PY

          # GitHub issues the release attestation shortly after publication.
          for attempt in 1 2 3 4 5 6; do
            if gh release verify "${TAG}" --repo "${GITHUB_REPOSITORY}" \
              && gh release verify-asset "${TAG}" "${archive}" --repo "${GITHUB_REPOSITORY}" \
              && gh release verify-asset "${TAG}" "${archive}.sha256" --repo "${GITHUB_REPOSITORY}"; then
              exit 0
            fi
            sleep $((attempt * 10))
          done
          echo "The release attestation did not verify; re-run the failed jobs." >&2
          exit 1

  marketplace:
    needs: [validate, verify]
    permissions:
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
        with:
          fetch-depth: 0
          fetch-tags: true
          persist-credentials: false

      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.11"

      - name: Point the marketplace at the release
        env:
          COMMIT_SHA: ${{ needs.validate.outputs.commit_sha }}
          GH_TOKEN: ${{ github.token }}
          PLUGIN: ${{ inputs.plugin }}
          VERSION: ${{ needs.validate.outputs.version }}
        run: |
          marketplace=".claude-plugin/marketplace.json"
          gh auth setup-git
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          for attempt in 1 2 3; do
            git fetch origin "${GITHUB_REF_NAME}"
            git checkout --quiet --detach "origin/${GITHUB_REF_NAME}"
            python3 scripts/update-marketplace.py "${PLUGIN}" --sha "${COMMIT_SHA}"
            changed="$(git status --porcelain)"
            if [ -z "${changed}" ]; then
              exit 0
            fi
            if [ "${changed}" != " M ${marketplace}" ]; then
              echo "Marketplace update changed unexpected paths:" >&2
              echo "${changed}" >&2
              exit 1
            fi
            git add "${marketplace}"
            git commit --quiet -m "Point marketplace at ${PLUGIN} ${VERSION}"
            if git push origin "HEAD:${GITHUB_REF_NAME}"; then
              exit 0
            fi
            echo "${GITHUB_REF_NAME} moved during the update; retrying." >&2
            sleep $((attempt * 5))
          done
          echo "Could not push the marketplace update; re-run the failed job." >&2
          exit 1
