[tool.ruff]
line-length = 100
# Repository tooling (scripts/ and tests/) needs Python 3.11 or newer.
target-version = "py311"

[tool.ruff.per-file-target-version]
# The plugins and their tests run on Python 3.9 or newer, so newer syntax
# there is an error.
"packages/**" = "py39"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
