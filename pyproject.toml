[tool.ruff]
line-length = 100
# Repository tooling (scripts/ and tests/) needs Python 3.11 or newer.
target-version = "py311"

[tool.ruff.per-file-target-version]
# The plugins and their tests run on Python 3.9 or newer, so newer syntax
# there is an error.
"packages/**" = "py39"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]

[tool.coverage.run]
branch = true
# Several tests start a script in a child process. This measures those too.
patch = ["subprocess"]
source = ["scripts", "packages"]
omit = ["*/tests/*"]

[tool.coverage.report]
# `make coverage` fails below this. The total was 89.9% when the floor was set.
fail_under = 87
precision = 1
